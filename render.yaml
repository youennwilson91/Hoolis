services:
  # Backend Django API
  - type: web
    name: hoolis-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py populate_db --force
    startCommand: gunicorn mysite.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: PREVIEW_PASSWORD
        value: patesaussice91!
      - key: ALLOWED_HOSTS
        value: hoolis-api.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://hoolis.vercel.app/
      - key: DATABASE_URL
        fromDatabase:
          name: hoolis-db
          property: connectionString
# Base de données PostgreSQL
databases:
  - name: hoolis_db
    region: oregon
    plan: free 