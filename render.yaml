services:
  # Backend Django API
  - type: web
    name: hoolis-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn -c gunicorn.conf.py mysite.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PREVIEW_PASSWORD
        value: patesaussice91!
      - key: ALLOWED_HOSTS
        value: hoolis-api.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://hoolis.vercel.app,https://hoolis-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: hoolis-db
          property: connectionString

  # Frontend React (optionnel - recommandé sur Vercel/Netlify)
  - type: web
    name: hoolis-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hoolis-api.onrender.com

# Base de données PostgreSQL
databases:
  - name: hoolis-db
    region: oregon
    plan: free 