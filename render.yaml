services:
  # Backend Django
  - type: web
    name: hoolis-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      gunicorn mysite.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: PREVIEW_PASSWORD
        value: patesaussice91!
      - key: ALLOWED_HOSTS
        value: hoolis-backend.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://hoolis-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hoolis-db
          property: connectionString

  # Frontend React (optionnel - peut être déployé séparément)
  - type: web
    name: hoolis-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://hoolis-backend.onrender.com

# Base de données PostgreSQL
databases:
  - name: hoolis-db
    region: oregon
    plan: free 